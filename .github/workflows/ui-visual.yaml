name: UI Visual Regression

# AUT-657: advisory screenshot diffs. The job never blocks a merge (continue-on-error) and is not a required check.
on:
  pull_request:
    branches:
      - main
      - 'feat/*'
      - 'feature/*'
    paths:
      - 'apps/core-web/**'
      - 'locales/**'
      - '.github/workflows/ui-visual.yaml'
      # npm ci installs the UI dependency tree from the root lockfile, and setup-node reads .nvmrc;
      # a bump in any of these can change text rendering and must trigger the advisory job.
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
  workflow_dispatch:

concurrency:
  group: ui-visual-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui-visual:
    name: UI Visual Regression (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    # Baselines are Linux Chromium from this image. Keep the tag equal to build.yaml and the playwright version in
    # package-lock.json (check-playwright-docker-version.spec.ts guards build.yaml only, so bump this file with it).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Compare screenshots with the baselines
        run: npm run test:visual --workspace=core-web

      - name: Upload expected, actual and diff images
        if: failure()
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-visual-diff
          path: |
            apps/core-web/test-results
            apps/core-web/playwright-report
          retention-days: 14
          if-no-files-found: warn

      - name: Link the diff artifact in the job summary
        if: failure()
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "### Visual differences found (advisory)"
            echo "Expected, actual and diff images: [ui-visual-diff]($ARTIFACT_URL)"
            echo "A deliberate change updates the baselines with \`npm run test:visual:update\`, see apps/core-web/e2e/README.md."
          } >> "$GITHUB_STEP_SUMMARY"
