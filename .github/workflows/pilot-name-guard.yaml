name: Pilot Name Guard

on:
  pull_request_target:
    branches:
      - main
      - 'feat/*'
      - 'feature/*'
    types:
      - opened
      - synchronize
      - reopened
      - edited

concurrency:
  group: pilot-name-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pilot-name-guard:
    name: Pilot Name Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout base tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc

      - name: Scan PR title, body, branch, commits, and diff from base tree
        env:
          PILOT_NAME_PATTERNS: ${{ secrets.PILOT_NAME_PATTERNS }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GIT_HEAD_REF: refs/remotes/origin/pr-head
        run: |
          git fetch --no-tags origin "refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/origin/pr-head"
          MERGE_BASE=$(git merge-base HEAD refs/remotes/origin/pr-head)
          export MERGE_BASE
          node .github/scripts/pilot-name-guard.mjs
