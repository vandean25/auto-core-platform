name: Full-stack Playwright

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/**'
      - '.github/workflows/e2e-fullstack.yaml'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-fullstack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-fullstack:
    name: Full-stack Playwright (${{ github.event_name == 'pull_request' && 'PR gate' || 'nightly / manual' }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
    services:
      postgres:
        # Docker Hub mirror: avoids the anonymous Docker Hub pull rate limit on shared runners
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auto_core_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm exec --workspace=core-api -- prisma generate


      - name: Verify full-stack Vite host
        run: node --test apps/core-web/e2e-fullstack/run-vite.test.mjs

      - name: Verify full-stack PR gate contract
        run: node --test apps/core-web/e2e-fullstack/gate.contract.test.mjs

      - name: Run full-stack Playwright harness
        env:
          DATABASE_URL: postgresql://postgres:postgres@postgres:5432/auto_core_test
          CI: true
        run: npm run test:e2e:fullstack --workspace=core-web

      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-fullstack-artifacts
          path: |
            apps/core-web/playwright-report
            apps/core-web/test-results
          retention-days: 14
          if-no-files-found: warn

  # AUT-899: the 5,000-row supplier-price-list benchmark runs here nightly instead of
  # the PR e2e shards. Exceeding the < 10 s threshold fails the Jest assertion, the
  # step exits non-zero, and this job (and the run) turns red.
  backend-e2e-benchmark:
    if: github.event_name != 'pull_request'
    name: Backend E2E Benchmark (nightly / manual)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    services:
      postgres:
        # Docker Hub mirror: avoids the anonymous Docker Hub pull rate limit on shared runners
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auto_core_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm exec --workspace=core-api -- prisma generate

      - name: Run backend E2E benchmark suites
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auto_core_test
          CI: true
        run: |
          npm exec --workspace=core-api -- prisma migrate deploy
          npm run test:e2e:benchmark --workspace=core-api
