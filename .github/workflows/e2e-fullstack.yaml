name: Full-stack Playwright

on:
  schedule:
    # Nightly harness (not a PR gate yet). Promotion: after 2 consecutive weeks
    # green, add pull_request with paths: ['apps/**'] below.
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-fullstack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-fullstack:
    name: Full-stack Playwright (nightly / manual)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auto_core_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm exec --workspace=core-api -- prisma generate

      - name: Install Playwright browsers
        run: npm exec --workspace=core-api -- playwright install --with-deps chromium

      - name: Run full-stack Playwright harness
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auto_core_test
          CI: true
        run: npm run test:e2e:fullstack --workspace=core-web

      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-fullstack-artifacts
          path: |
            apps/core-web/playwright-report
            apps/core-web/test-results
          retention-days: 14
          if-no-files-found: warn
