name: PR Build Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  contract-guard:
    name: Contract Guard (Invoice tax_rate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Verify backend/frontend tax contract alignment
        run: |
          node - <<'NODE'
          const fs = require('node:fs')

          const dto = fs.readFileSync('apps/core-api/src/sales/dto/create-invoice.dto.ts', 'utf8')
          if (!/taxRate:\s*number\b/.test(dto)) {
            throw new Error('Backend DTO contract changed: CreateInvoiceItemDto.taxRate must remain number.')
          }

          const webTypes = fs.readFileSync('apps/core-web/src/api/types.ts', 'utf8')
          const invoiceItemBlock = webTypes.match(/export interface InvoiceItem\s*{[\s\S]*?}/)
          if (!invoiceItemBlock || !/tax_rate:\s*number\b/.test(invoiceItemBlock[0])) {
            throw new Error('Frontend API contract mismatch: InvoiceItem.tax_rate must be number.')
          }
          const revenueGroupBlock = webTypes.match(/export interface RevenueGroup\s*{[\s\S]*?}/)
          if (!revenueGroupBlock || !/tax_rate:\s*number\b/.test(revenueGroupBlock[0])) {
            throw new Error('Frontend API contract mismatch: RevenueGroup.tax_rate must be number.')
          }
          if (/tax_rate:\s*string\s*\|\s*number\b/.test(revenueGroupBlock[0])) {
            throw new Error('RevenueGroup.tax_rate drift detected: string | number is not allowed.')
          }

          const invoiceCreatePage = fs.readFileSync('apps/core-web/src/pages/sales/InvoiceCreatePage.tsx', 'utf8')
          const mapsTaxRate = /taxRate:\s*(Number\()?\s*item\.tax_rate/.test(invoiceCreatePage)
          if (!mapsTaxRate) {
            throw new Error('Invoice payload mapping missing: expected taxRate to map from item.tax_rate.')
          }

          console.log('Contract guard passed.')
          NODE

  backend:
    name: Backend Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/core-api
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/core-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build backend
        run: npm run build

      - name: Run unit tests
        run: npm test -- --ci --runInBand

  frontend:
    name: Frontend Build and Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/core-web
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/core-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        # PR workflow uses this build for compile-time validation only.
        # It intentionally does not inject production VITE_* runtime values.
        run: npm run build
