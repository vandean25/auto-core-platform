name: PR Build Check

on:
  pull_request:
    # branches matches the PR base (target), not the head (source).
    # PRs from feature/* into main already run via `main`. Include feature/*
    # and feat/* so stacked PRs targeting those prefixes also run checks.
    branches:
      - main
      - 'feat/*'
      - 'feature/*'
  workflow_dispatch:

concurrency:
  group: pr-build-check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    name: Mintlify docs guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify Mintlify excludes app assets
        run: npm run docs:verify-mintignore

  api-contract:
    name: API Contract (OpenAPI + Generated Types)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: |
          for i in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed (attempt $i/3), retrying..."
            sleep 5
          done
          exit 1

      - name: Generate Prisma Client
        run: npm exec --workspace=core-api -- prisma generate

      - name: Verify backend ESM source contract
        run: npm run check:esm --workspace=core-api

      - name: Verify backend OpenAPI contract is up to date
        run: npm run openapi:check --workspace=core-api

      - name: Verify frontend generated API types are up to date
        run: npm run api:types:check --workspace=core-web

  contract-guard:
    name: Contract Guard (API Type Drift)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Verify backend/frontend contract alignment
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')

          /**
           * Recursively collects backend DTO source files for guard checks.
           * @param {string} dir Root directory to scan.
           * @returns {string[]} Absolute or relative file paths.
           */
          function collectDtoFiles(dir) {
            const out = []
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name)
              if (entry.isDirectory()) {
                out.push(...collectDtoFiles(full))
              } else if (entry.isFile() && entry.name.endsWith('.dto.ts')) {
                out.push(full)
              }
            }
            return out
          }

          // Generic DTO hygiene guard for all backend DTO files.
          const dtoFiles = collectDtoFiles('apps/core-api/src')
          for (const file of dtoFiles) {
            const src = fs.readFileSync(file, 'utf8')
            if (/\:\s*any\b/.test(src)) {
              throw new Error(`DTO guard failed (${file}): avoid using 'any' in DTO fields.`)
            }

            const lines = src.split(/\r?\n/)
            let inClass = false
            for (let i = 0; i < lines.length; i++) {
              const line = lines[i]
              if (/^\s*export\s+class\s+/.test(line)) inClass = true
              if (inClass && /^\s*}\s*$/.test(line)) inClass = false
              if (!inClass) continue

              const isProp = /^\s*[A-Za-z_][A-Za-z0-9_]*[!?]?:\s*[^;]+;/.test(line)
              if (!isProp) continue

              let hasDecorator = false
              for (let j = i - 1; j >= 0; j--) {
                const prev = lines[j].trim()
                if (!prev) break
                if (prev.startsWith('@')) {
                  hasDecorator = true
                  break
                }
                if (prev.endsWith('{') || prev.startsWith('export class ')) break
              }
              if (!hasDecorator) {
                throw new Error(`DTO guard failed (${file}:${i + 1}): DTO property is missing validation decorators.`)
              }
            }
          }

          const invoiceDto = fs.readFileSync('apps/core-api/src/sales/dto/create-invoice.dto.ts', 'utf8')
          if (!/taxRate!?:\s*number\b/.test(invoiceDto)) {
            throw new Error('Backend DTO contract changed: CreateInvoiceItemDto.taxRate must remain number.')
          }
          const salesOrderDto = fs.readFileSync('apps/core-api/src/sales/sales-order/dto/create-sales-order.dto.ts', 'utf8')
          if (!/tax_rate\?:\s*number\b/.test(salesOrderDto)) {
            throw new Error('Backend DTO contract changed: CreateSalesOrderItemDto.tax_rate must remain optional number.')
          }
          const revenueGroupDto = fs.readFileSync('apps/core-api/src/finance/dto/create-revenue-group.dto.ts', 'utf8')
          if (!/tax_rate!?:\s*number\b/.test(revenueGroupDto)) {
            throw new Error('Backend DTO contract changed: CreateRevenueGroupDto.tax_rate must remain number.')
          }

          const generatedOpenApi = fs.readFileSync('apps/core-web/src/api/generated/openapi.ts', 'utf8')

          /**
           * Extracts a generated OpenAPI schema object literal by identifier.
           * @param {string} src Generated openapi.ts contents.
           * @param {string} name Schema name, e.g. InvoiceItemResponseDto.
           * @returns {string|null} The `{ ... }` body, or null if missing.
           */
          function extractSchema(src, name) {
            const match = new RegExp(`\\b${name}:\\s*\\{`).exec(src)
            if (!match) return null
            const brace = src.indexOf('{', match.index)
            let depth = 0
            for (let i = brace; i < src.length; i++) {
              if (src[i] === '{') depth++
              else if (src[i] === '}') {
                depth--
                if (depth === 0) return src.slice(brace, i + 1)
              }
            }
            return null
          }

          /**
           * Asserts a generated response schema declares required tax_rate as number.
           * @param {string} schemaName
           */
          function assertGeneratedTaxRateIsNumber(schemaName) {
            const block = extractSchema(generatedOpenApi, schemaName)
            if (!block) {
              throw new Error(`Generated OpenAPI schema missing: ${schemaName}`)
            }
            if (!/^\s*tax_rate:\s*number\s*;/m.test(block)) {
              throw new Error(`Frontend API contract mismatch: ${schemaName}.tax_rate must be number.`)
            }
            if (/^\s*tax_rate\??:\s*string\b/m.test(block)) {
              throw new Error(`tax_rate drift detected in generated OpenAPI: ${schemaName}.tax_rate must not be string.`)
            }
          }

          assertGeneratedTaxRateIsNumber('InvoiceItemResponseDto')
          assertGeneratedTaxRateIsNumber('SalesOrderItemResponseDto')
          assertGeneratedTaxRateIsNumber('RevenueGroupResponseDto')

          const webTypes = fs.readFileSync('apps/core-web/src/api/types.ts', 'utf8')
          if (!/export type InvoiceItem\s*=\s*Invoice\['items'\]\[number\]/.test(webTypes)) {
            throw new Error('Frontend API contract mismatch: InvoiceItem must alias generated Invoice items.')
          }
          if (!/export type SalesOrderItem\s*=\s*SalesOrder\['items'\]\[number\]/.test(webTypes)) {
            throw new Error('Frontend API contract mismatch: SalesOrderItem must alias generated SalesOrder items.')
          }
          if (!/export type RevenueGroup\s*=\s*OpenApiSchemas\['RevenueGroupResponseDto'\]/.test(webTypes)) {
            throw new Error('Frontend API contract mismatch: RevenueGroup must alias RevenueGroupResponseDto.')
          }
          if (/tax_rate:\s*string\s*(\|\s*number)?\b/.test(webTypes)) {
            throw new Error('tax_rate drift detected in frontend shared API types: string-based tax_rate is not allowed.')
          }

          const invoiceDraftEditPage = fs.readFileSync('apps/core-web/src/pages/sales/InvoiceDraftEditPage.tsx', 'utf8')
          const mapsTaxRate = /taxRate:\s*(Number\()?\s*item\.tax_rate/.test(invoiceDraftEditPage)
          if (!mapsTaxRate) {
            throw new Error('Invoice payload mapping missing: expected taxRate to map from item.tax_rate.')
          }
          const salesOrderCreatePage = fs.readFileSync('apps/core-web/src/pages/sales-orders/SalesOrderCreate.tsx', 'utf8')
          if (!/tax_rate:\s*Number\(\s*item\.tax_rate\s*\)/.test(salesOrderCreatePage)) {
            throw new Error('Sales order payload mapping missing: expected tax_rate to be normalized with Number(item.tax_rate).')
          }
          const revenueGroupDialog = fs.readFileSync('apps/core-web/src/components/AddRevenueGroupDialog.tsx', 'utf8')
          if (!/tax_rate:\s*parseFloat\(/.test(revenueGroupDialog)) {
            throw new Error('Revenue group payload mapping missing: expected tax_rate to use parseFloat().')
          }

          console.log('Contract guard passed.')
          NODE

  backend:
    name: Backend Lint, Typecheck and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm exec --workspace=core-api -- prisma generate

      - name: Verify tenant restore manifest
        run: npm run tenant-restore:verify

      - name: Lint Prisma tenant isolation invariants
        run: npm run lint:prisma-tenant --workspace=core-api

      - name: Lint backend
        run: npm run lint --workspace=core-api

      - name: Build backend
        # Typecheck gate: tsc runs here and fails the job on any type error.
        run: npm run build --workspace=core-api

      - name: Verify backend ESM production artifact
        run: npm run verify:esm-artifact --workspace=core-api

      - name: Verify E2E batch runner
        run: npm run test:e2e:runner --workspace=core-api

  backend-unit:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm exec --workspace=core-api -- prisma generate

      - name: Run unit tests in parallel
        # No Postgres service: no unit spec opens a database connection.
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auto_core_test
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm test --workspace=core-api -- --ci --maxWorkers=4 --testPathIgnorePatterns='document-branding-pdf-parser\.spec\.ts$'

      - name: Run timing-sensitive unit tests serially
        # The PDF rasterization spec exceeds its 5 s budget when it shares CPU with parallel workers.
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auto_core_test
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm test --workspace=core-api -- --ci --runInBand --testPathPatterns='document-branding-pdf-parser\.spec\.ts$'

  backend-e2e:
    name: Backend E2E Tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        # Docker Hub mirror: avoids the anonymous Docker Hub pull rate limit on shared runners
        image: mirror.gcr.io/library/postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auto_core_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm exec --workspace=core-api -- prisma generate

      - name: Install backend Playwright browser
        run: npm exec --workspace=core-api -- playwright install --with-deps chromium

      - name: Run E2E tests
        # Each shard has its own Postgres service, so shards never share a database.
        timeout-minutes: 15
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auto_core_test
          INVOICE_BRANDING_WRITER_ENABLED: 'true'
          DOCUMENT_BRANDING_VISUAL_ARTIFACT_DIR: ${{ runner.temp }}/document-branding-visual-fixtures
        run: |
          npm exec --workspace=core-api -- prisma migrate deploy
          npm run test:e2e:ci --workspace=core-api -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload document branding visual fixtures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: document-branding-visual-fixtures-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/document-branding-visual-fixtures
          retention-days: 14
          if-no-files-found: warn

  backend-gate:
    # Aggregator: keeps the original required-check name and passes only when every backend job passed.
    name: Backend Build and Test
    needs: [backend, backend-unit, backend-e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every backend job to pass
        env:
          LINT_BUILD: ${{ needs.backend.result }}
          UNIT: ${{ needs.backend-unit.result }}
          E2E: ${{ needs.backend-e2e.result }}
        run: |
          echo "backend (lint, typecheck, build): $LINT_BUILD"
          echo "backend-unit: $UNIT"
          echo "backend-e2e: $E2E"
          test "$LINT_BUILD" = success && test "$UNIT" = success && test "$E2E" = success

  frontend-unit:
    # Lint, build and Vitest. Runs in parallel with frontend-e2e; the `frontend` job below is the
    # required check that aggregates both.
    name: Frontend Lint, Build and Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Runner CPU count
        run: echo "vCPUs=$(nproc)"

      - name: Restore ESLint cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: apps/core-web/node_modules/.cache/eslint/
          key: eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/core-web/eslint.config.js') }}-${{ github.run_id }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/core-web/eslint.config.js') }}-

      - name: Lint frontend
        run: npm run lint --workspace=core-web

      - name: Build frontend
        # PR workflow uses this build for compile-time validation only.
        # It intentionally does not inject production VITE_* runtime values.
        run: npm run build --workspace=core-web

      - name: Verify frontend build chunk manifest
        run: npm run build:verify-chunks

      - name: Verify build chunk manifest script (unit tests)
        run: npm run build:verify-chunks:test

      - name: Run frontend unit tests
        run: npm test --workspace=core-web

  frontend-e2e:
    # Playwright UI smoke, split into shards that run in parallel on separate runners. The suite runs
    # against a production bundle built with the E2E flags baked in: `npm run test:e2e` builds it, then
    # serves it with `vite preview`. No API/Postgres: the flags make the app skip auth.
    name: Frontend UI Smoke (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Runner CPU count
        run: echo "vCPUs=$(nproc)"

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browser cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        run: npm exec --workspace=core-web -- playwright install --with-deps chromium

      - name: Run Playwright UI smoke tests
        run: npm run test:e2e --workspace=core-web -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            apps/core-web/playwright-report
            apps/core-web/test-results
          retention-days: 14
          if-no-files-found: warn

  frontend:
    # Aggregating job. It keeps the required check name "Frontend Build, Lint and UI Smoke" and passes
    # only when every frontend job above (all E2E shards included) passed.
    name: Frontend Build, Lint and UI Smoke
    needs: [frontend-unit, frontend-e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every frontend job to pass
        env:
          UNIT_RESULT: ${{ needs.frontend-unit.result }}
          E2E_RESULT: ${{ needs.frontend-e2e.result }}
        run: |
          echo "Lint, build and unit tests: $UNIT_RESULT"
          echo "UI smoke shards: $E2E_RESULT"
          test "$UNIT_RESULT" = "success" && test "$E2E_RESULT" = "success"

  infrastructure:
    name: Terraform Infrastructure Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.15.9

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra

      - name: Initialize Terraform providers
        run: terraform -chdir=infra init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform -chdir=infra validate

  repowise-health-gate:
    # Advisory since 2026-10-10: the gate no longer blocks merges (it penalised branch history
    # signals that main never sees after a squash merge). The job keeps its name so any existing
    # required-check setting still reports green. Re-enable by removing `continue-on-error` below.
    name: Repowise Health Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history: the gate diffs against the PR base and scores the base commit from a worktree.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Verify health gate unit tests
        run: npm run repowise:gate:test

      - name: Check changed source files against the Repowise health baseline
        continue-on-error: true
        # Changed source files must not score lower than on the base commit, new source files
        # must score >= 6.0, and .repowise-baseline.json must track legacy (<6.0) scores.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run repowise:gate -- --base "${BASE_SHA:-origin/main}"
