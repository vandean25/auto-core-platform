version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/apps/core-api"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
    open-pull-requests-limit: 10
    groups:
      prisma-stack:
        patterns:
          - "@prisma/*"
          - "prisma"
      nestjs-stack:
        patterns:
          - "@nestjs/*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/apps/core-web"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
    open-pull-requests-limit: 10
    groups:
      ui-libraries:
        patterns:
          - "@radix-ui/*"
          - "lucide-react"
          - "clsx"
        update-types:
          - "minor"
          - "patch"
