version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/apps/core-api"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    groups:
      prisma-stack:
        patterns:
          - "@prisma/*"
          - "prisma"
      nestjs-stack:
        patterns:
          - "@nestjs/*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    # Restrict major version bumps for core tooling with large peer dependency trees
    # These require careful verification of transitive dependencies compatibility
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "ts-jest"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "typescript-eslint"
        update-types:
          - "version-update:semver-major"
    # Note: @eslint/js should be kept in sync with eslint version
    # If eslint needs a major update, verify @eslint/js compatibility first

  - package-ecosystem: "npm"
    directory: "/apps/core-web"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    groups:
      ui-libraries:
        patterns:
          - "@radix-ui/*"
          - "lucide-react"
          - "clsx"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
