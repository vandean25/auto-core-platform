version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      prisma-stack:
        patterns:
          - "@prisma/*"
          - "prisma"
      nestjs-stack:
        patterns:
          - "@nestjs/*"
        update-types:
          - "minor"
          - "patch"
      ui-libraries:
        patterns:
          - "@radix-ui/*"
          - "lucide-react"
          - "clsx"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "docker"
    directory: "/apps/core-api"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
