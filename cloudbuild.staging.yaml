# Staging/UAT API-only pipeline. The operator must create a push trigger for
# main and provide any environment-specific substitution overrides.
substitutions:
  _BACKEND_PROJECT: auto-core-platform
  _BACKEND_FIREBASE_PROJECT_ID: auto-core-platform-vande
  _DATABASE_SECRET: DATABASE_URL_UAT
  _DATABASE_POOLED_SECRET: acp-core-api-database-url-pooled
  _DATABASE_POOLER_REQUIRED: "false"
  _REGION: europe-west3
  _RUN_SERVICE: core-api-staging
  _AR_REPO: core-services
  _FRONTEND_URL: https://auto-core-platform-vande.web.app

options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/${_BACKEND_PROJECT}/secrets/${_DATABASE_SECRET}/versions/latest
      env: DATABASE_URL

steps:
  - id: migrate-db
    name: node:22
    entrypoint: bash
    secretEnv:
      - DATABASE_URL
    args:
      - -lc
      - |
        set -euo pipefail
        npm ci
        npm exec --workspace=core-api -- ts-node -r tsconfig-paths/register scripts/prisma-migrate-deploy-exit.ts

  - id: build-api-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target
      - api
      - -f
      - apps/core-api/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${_BACKEND_PROJECT}/${_AR_REPO}/${_RUN_SERVICE}:${SHORT_SHA}
      - .

  - id: push-api-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${_BACKEND_PROJECT}/${_AR_REPO}/${_RUN_SERVICE}:${SHORT_SHA}

  - id: deploy-staging-cloud-run
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -lc
      - |
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/${_BACKEND_PROJECT}/${_AR_REPO}/${_RUN_SERVICE}:${SHORT_SHA}"
        gcloud run deploy "${_RUN_SERVICE}" \
          --image "$$IMAGE" \
          --region "${_REGION}" \
          --project "${_BACKEND_PROJECT}" \
          --allow-unauthenticated \
          --set-env-vars "NODE_ENV=production,FRONTEND_URL=${_FRONTEND_URL},SENTRY_RELEASE=${SHORT_SHA},FIREBASE_PROJECT_ID=${_BACKEND_FIREBASE_PROJECT_ID},DATABASE_POOLER_REQUIRED=${_DATABASE_POOLER_REQUIRED}" \
          --set-secrets "DATABASE_URL=${_DATABASE_SECRET}:latest,DATABASE_URL_POOLED=${_DATABASE_POOLED_SECRET}:latest,SENTRY_DSN=acp-core-api-sentry-dsn:latest,INVOICE_PDF_BUCKET=INVOICE_PDF_BUCKET:latest,SECRET_ENCRYPTION_KEY=SECRET_ENCRYPTION_KEY:latest" \
          --cpu 1 \
          --memory 512Mi \
          --concurrency 40 \
          --min-instances 0 \
          --max-instances 2 \
          --quiet
