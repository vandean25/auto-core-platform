substitutions:
  _BACKEND_PROJECT: auto-core-platform
  _BACKEND_FIREBASE_PROJECT_ID: auto-core-platform-vande
  _DATABASE_SECRET: DATABASE_URL_UAT
  # Neon/PgBouncer pooler secret for Cloud Run runtime. Keep migrate-db on _DATABASE_SECRET
  # (direct). Override this substitution to the pooler secret once it exists in GSM.
  _DATABASE_POOLED_SECRET: DATABASE_URL_UAT
  _FRONTEND_PROJECT: auto-core-platform-vande
  _REGION: europe-west3
  _RUN_SERVICE: core-api
  _PDF_WORKER_SERVICE: core-api-pdf-worker
  _CLOUD_TASKS_INVOKER_SA: cloud-tasks-pdf-invoker@auto-core-platform.iam.gserviceaccount.com
  _AR_REPO: core-services
  _FRONTEND_URL: https://auto-core-platform-vande.web.app
  _VITE_FIREBASE_AUTH_DOMAIN: auto-core-platform-vande.firebaseapp.com
  _VITE_FIREBASE_PROJECT_ID: auto-core-platform-vande
  _VITE_FIREBASE_APP_ID: 1:895976476759:web:d69c51386996793445d312

options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/${_BACKEND_PROJECT}/secrets/${_DATABASE_SECRET}/versions/latest
      env: DATABASE_URL
    # Leftover from retired ApiKeyGuard. Cloud Run still receives API_KEY and the
    # frontend build still sets VITE_API_KEY, but Nest uses JwtAuthGuard globally
    # and Cloud Tasks use CLOUD_TASKS_WORKER_SECRET. Frontend source does not
    # read VITE_API_KEY. Keep injecting until a dedicated deploy cleanup removes
    # the GSM secret; do not set API_KEY in e2e.
    - versionName: projects/${_BACKEND_PROJECT}/secrets/API_KEY/versions/latest
      env: API_KEY
    - versionName: projects/${_FRONTEND_PROJECT}/secrets/acp-web-firebase-api-key/versions/latest
      env: VITE_FIREBASE_API_KEY
    - versionName: projects/${_BACKEND_PROJECT}/secrets/acp-web-sentry-dsn/versions/latest
      env: VITE_SENTRY_DSN
    - versionName: projects/${_BACKEND_PROJECT}/secrets/acp-web-sentry-auth-token/versions/latest
      env: SENTRY_AUTH_TOKEN
    - versionName: projects/${_BACKEND_PROJECT}/secrets/acp-web-sentry-org/versions/latest
      env: SENTRY_ORG
    - versionName: projects/${_BACKEND_PROJECT}/secrets/acp-web-sentry-project/versions/latest
      env: SENTRY_PROJECT

steps:
  - id: migrate-db
    name: node:22
    entrypoint: bash
    secretEnv:
      - DATABASE_URL
    args:
      - -lc
      - |
        # Fail this tag-triggered production deploy on any `prisma migrate deploy`
        # non-zero exit, including Prisma P3005 (schema not empty / not baselined).
        # Baselining is a manual one-shot: `npm run db:baseline -- --applied <migration>`.
        # Do not skip P3005 here.
        set -euo pipefail
        npm ci
        npm exec --workspace=core-api -- ts-node -r tsconfig-paths/register scripts/prisma-migrate-deploy-exit.ts

  - id: build-api-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/core-api/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${_BACKEND_PROJECT}/${_AR_REPO}/${_RUN_SERVICE}:${TAG_NAME}
      - .

  - id: push-api-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${_BACKEND_PROJECT}/${_AR_REPO}/${_RUN_SERVICE}:${TAG_NAME}

  - id: deploy-pdf-worker
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -lc
      - |
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/${_BACKEND_PROJECT}/${_AR_REPO}/${_RUN_SERVICE}:${TAG_NAME}"
        # Worker is IAM-protected (--no-allow-unauthenticated). It validates HMAC worker
        # requests but does NOT receive CLOUD_TASKS_ENABLED/QUEUE/TARGET_BASE_URL (no self-enqueue).
        gcloud run deploy "${_PDF_WORKER_SERVICE}" \
          --image "$$IMAGE" \
          --region "${_REGION}" \
          --project "${_BACKEND_PROJECT}" \
          --no-allow-unauthenticated \
          --set-env-vars "NODE_ENV=production,FRONTEND_URL=${_FRONTEND_URL},SENTRY_RELEASE=${TAG_NAME},FIREBASE_PROJECT_ID=${_BACKEND_FIREBASE_PROJECT_ID}" \
          --set-secrets "DATABASE_URL=${_DATABASE_SECRET}:latest,DATABASE_URL_POOLED=${_DATABASE_POOLED_SECRET}:latest,API_KEY=API_KEY:latest,SENTRY_DSN=acp-core-api-sentry-dsn:latest,INVOICE_PDF_BUCKET=INVOICE_PDF_BUCKET:latest,WORKSHOP_MEDIA_BUCKET=WORKSHOP_MEDIA_BUCKET:latest,SECRET_ENCRYPTION_KEY=SECRET_ENCRYPTION_KEY:latest,CLOUD_TASKS_WORKER_SECRET=CLOUD_TASKS_WORKER_SECRET:latest" \
          --cpu 1 \
          --memory 2Gi \
          --concurrency 1 \
          --min-instances 0 \
          --max-instances 2 \
          --quiet

  - id: export-pdf-worker-url
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -lc
      - |
        set -euo pipefail
        gcloud run services describe "${_PDF_WORKER_SERVICE}" \
          --region "${_REGION}" \
          --project "${_BACKEND_PROJECT}" \
          --format='value(status.url)' > /workspace/.pdf_worker_url

  - id: deploy-cloud-run
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -lc
      - |
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/${_BACKEND_PROJECT}/${_AR_REPO}/${_RUN_SERVICE}:${TAG_NAME}"
        WORKER_URL="$$(cat /workspace/.pdf_worker_url)"
        # Socket.IO: min-instances 1 + continuous CPU for heartbeats. REDIS_URL is Upstash
        # (public TLS) from GSM — no VPC connector. These flags apply only to core-api,
        # not core-api-pdf-worker.
        gcloud run deploy "${_RUN_SERVICE}" \
          --image "$$IMAGE" \
          --region "${_REGION}" \
          --project "${_BACKEND_PROJECT}" \
          --allow-unauthenticated \
          --set-env-vars "NODE_ENV=production,FRONTEND_URL=${_FRONTEND_URL},SENTRY_RELEASE=${TAG_NAME},FIREBASE_PROJECT_ID=${_BACKEND_FIREBASE_PROJECT_ID},CLOUD_TASKS_ENABLED=true,CLOUD_TASKS_LOCATION=${_REGION},CLOUD_TASKS_QUEUE=pdf-queue,CLOUD_TASKS_TARGET_BASE_URL=$$WORKER_URL/api,CLOUD_TASKS_INVOKER_SA=${_CLOUD_TASKS_INVOKER_SA}" \
          --set-secrets "DATABASE_URL=${_DATABASE_SECRET}:latest,DATABASE_URL_POOLED=${_DATABASE_POOLED_SECRET}:latest,API_KEY=API_KEY:latest,SENTRY_DSN=acp-core-api-sentry-dsn:latest,INVOICE_PDF_BUCKET=INVOICE_PDF_BUCKET:latest,SECRET_ENCRYPTION_KEY=SECRET_ENCRYPTION_KEY:latest,CLOUD_TASKS_WORKER_SECRET=CLOUD_TASKS_WORKER_SECRET:latest,REDIS_URL=REDIS_URL:latest" \
          --cpu 1 \
          --memory 512Mi \
          --concurrency 40 \
          --min-instances 1 \
          --no-cpu-throttling \
          --max-instances 5 \
          --quiet

  - id: export-run-url
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -lc
      - |
        set -euo pipefail
        gcloud run services describe "${_RUN_SERVICE}" \
          --region "${_REGION}" \
          --project "${_BACKEND_PROJECT}" \
          --format='value(status.url)' > /workspace/.run_url

  - id: build-frontend
    name: node:22
    entrypoint: bash
    secretEnv:
      - API_KEY
      - VITE_FIREBASE_API_KEY
      - VITE_SENTRY_DSN
      - SENTRY_AUTH_TOKEN
      - SENTRY_ORG
      - SENTRY_PROJECT
    args:
      - -lc
      - |
        set -euo pipefail
        RUN_URL="$$(cat /workspace/.run_url)"
        export VITE_API_BASE_URL="$$RUN_URL"
        export VITE_API_KEY="$$API_KEY"
        export VITE_FIREBASE_API_KEY="$$VITE_FIREBASE_API_KEY"
        export VITE_FIREBASE_AUTH_DOMAIN="${_VITE_FIREBASE_AUTH_DOMAIN}"
        export VITE_FIREBASE_PROJECT_ID="${_VITE_FIREBASE_PROJECT_ID}"
        export VITE_FIREBASE_APP_ID="${_VITE_FIREBASE_APP_ID}"
        export VITE_SENTRY_DSN="$$VITE_SENTRY_DSN"
        export SENTRY_AUTH_TOKEN="$$SENTRY_AUTH_TOKEN"
        export SENTRY_ORG="$$SENTRY_ORG"
        export SENTRY_PROJECT="$$SENTRY_PROJECT"
        export SENTRY_RELEASE="${TAG_NAME}"
        export VITE_APP_VERSION="${TAG_NAME}"
        npm ci
        npm run build --workspace=core-web

  - id: deploy-firebase-hosting
    name: us-docker.pkg.dev/firebase-cli/us/firebase
    args:
      - deploy
      - --project=${_FRONTEND_PROJECT}
      - --only=hosting
