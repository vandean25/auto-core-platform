substitutions:
  _BACKEND_PROJECT: auto-core-platform
  _FRONTEND_PROJECT: auto-core-platform-vande
  _REGION: europe-west3
  _RUN_SERVICE: core-api
  _AR_REPO: core-services
  _FRONTEND_URL: https://auto-core-platform-vande.web.app
  _VITE_FIREBASE_AUTH_DOMAIN: auto-core-platform-vande.firebaseapp.com
  _VITE_FIREBASE_PROJECT_ID: auto-core-platform-vande
  _VITE_FIREBASE_APP_ID: 1:895976476759:web:d69c51386996793445d312
  _VITE_ALLOWED_LOGIN_EMAILS: "van.dean25@gmail.com"

options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/${_BACKEND_PROJECT}/secrets/DATABASE_URL/versions/latest
      env: DATABASE_URL
    - versionName: projects/${_BACKEND_PROJECT}/secrets/API_KEY/versions/latest
      env: API_KEY
    - versionName: projects/${_BACKEND_PROJECT}/secrets/FIREBASE_API_KEY/versions/latest
      env: FIREBASE_API_KEY

steps:
  - id: migrate-db
    name: node:22
    dir: apps/core-api
    entrypoint: bash
    secretEnv:
      - DATABASE_URL
    args:
      - -lc
      - |
        set -euo pipefail
        npm install --legacy-peer-deps
        set +e
        MIGRATE_OUTPUT="$$(npx prisma migrate deploy 2>&1)"
        MIGRATE_EXIT=$?
        set -e
        echo "$$MIGRATE_OUTPUT"
        if [ "$$MIGRATE_EXIT" -ne 0 ]; then
          if echo "$$MIGRATE_OUTPUT" | grep -q "P3005"; then
            echo "Skipping migrate deploy because the database is not baselined yet."
          else
            exit "$$MIGRATE_EXIT"
          fi
        fi

  - id: build-api-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${_BACKEND_PROJECT}/${_AR_REPO}/${_RUN_SERVICE}:${TAG_NAME}
      - apps/core-api

  - id: push-api-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${_BACKEND_PROJECT}/${_AR_REPO}/${_RUN_SERVICE}:${TAG_NAME}

  - id: deploy-cloud-run
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -lc
      - |
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/${_BACKEND_PROJECT}/${_AR_REPO}/${_RUN_SERVICE}:${TAG_NAME}"
        gcloud run deploy "${_RUN_SERVICE}" \
          --image "$$IMAGE" \
          --region "${_REGION}" \
          --project "${_BACKEND_PROJECT}" \
          --allow-unauthenticated \
          --set-env-vars "NODE_ENV=production,FRONTEND_URL=${_FRONTEND_URL}" \
          --set-secrets "DATABASE_URL=DATABASE_URL:latest,API_KEY=API_KEY:latest" \
          --cpu 1 \
          --memory 512Mi \
          --concurrency 40 \
          --min-instances 0 \
          --max-instances 5 \
          --quiet

  - id: export-run-url
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -lc
      - |
        set -euo pipefail
        gcloud run services describe "${_RUN_SERVICE}" \
          --region "${_REGION}" \
          --project "${_BACKEND_PROJECT}" \
          --format='value(status.url)' > /workspace/.run_url

  - id: build-frontend
    name: node:22
    dir: apps/core-web
    entrypoint: bash
    secretEnv:
      - API_KEY
      - FIREBASE_API_KEY
    args:
      - -lc
      - |
        set -euo pipefail
        RUN_URL="$$(cat /workspace/.run_url)"
        if [ -z "$$FIREBASE_API_KEY" ]; then
          echo "Missing required secret env: FIREBASE_API_KEY"
          exit 1
        fi
        export VITE_API_BASE_URL="$$RUN_URL"
        export VITE_API_KEY="$$API_KEY"
        export VITE_FIREBASE_API_KEY="$$FIREBASE_API_KEY"
        export VITE_FIREBASE_AUTH_DOMAIN="${_VITE_FIREBASE_AUTH_DOMAIN}"
        export VITE_FIREBASE_PROJECT_ID="${_VITE_FIREBASE_PROJECT_ID}"
        export VITE_FIREBASE_APP_ID="${_VITE_FIREBASE_APP_ID}"
        export VITE_ALLOWED_LOGIN_EMAILS="${_VITE_ALLOWED_LOGIN_EMAILS}"
        npm install --legacy-peer-deps
        npm run build

  - id: deploy-firebase-hosting
    name: us-docker.pkg.dev/firebase-cli/us/firebase
    args:
      - deploy
      - --project=${_FRONTEND_PROJECT}
      - --only=hosting
