# Shared Postgres for parallel git worktrees (one database per worktree).
# Default host port 5433 avoids clashing with a primary dev Postgres on 5432.
#
#   docker compose -f docker-compose.worktrees.yml up -d
#
# Override port: ACP_WORKTREE_PG_PORT=5434 docker compose -f docker-compose.worktrees.yml up -d

services:
  postgres:
    image: postgres:15
    container_name: acp-worktrees-postgres
    ports:
      - "${ACP_WORKTREE_PG_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${ACP_WORKTREE_PG_USER:-postgres}
      POSTGRES_PASSWORD: ${ACP_WORKTREE_PG_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - acp_worktrees_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  acp_worktrees_postgres_data:
