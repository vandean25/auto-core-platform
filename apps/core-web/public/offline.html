<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Auto Core · Offline</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right)) max(1.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
        background: #ffffff;
        color: #0f172a;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.5;
      }
      main { max-width: 26rem; text-align: center; }
      img { width: 4rem; height: 4rem; border-radius: 0.75rem; }
      h1 { margin: 1.25rem 0 0.5rem; font-size: 1.5rem; letter-spacing: -0.01em; }
      p { margin: 0 0 0.75rem; color: #475569; }
      .en { font-size: 0.875rem; color: #64748b; }
      button {
        margin-top: 1rem;
        min-height: 2.75rem;
        padding: 0 1.5rem;
        border: 0;
        border-radius: 0.5rem;
        background: #1e3a8a;
        color: #ffffff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="64" height="64" />
      <h1>Keine Verbindung</h1>
      <p>Auto Core ist gerade nicht erreichbar. Bitte prüfen Sie Ihre Internetverbindung und versuchen Sie es erneut.</p>
      <p class="en" lang="en">No connection. Please check your internet connection and try again.</p>
      <button type="button" onclick="location.reload()">Erneut versuchen / Try again</button>
    </main>
  </body>
</html>
